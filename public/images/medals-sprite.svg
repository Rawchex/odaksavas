    <!-- Center Star Symbol -->
    <polygon points="32,27 34.5,33 41,33.5 36,37.5 37.5,44 32,40 26.5,44 28,37.5 23,33.5 29.5,33" fill="#334155"/>
    <!-- Inner Rank 2 Text -->
    <text x="32" y="41.5" font-size="14" font-weight="900" text-anchor="middle" fill="#F8FAFC">2</text>
    <defs>
      <linearGradient id="silverGrad" x1="16" y1="18" x2="48" y2="58" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F8FAFC"/>
