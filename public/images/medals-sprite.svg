<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- GOLD MEDAL (RANK 1) -->
  <symbol id="medal-gold" viewBox="0 0 64 64">
    <!-- Ribbon -->
    <path d="M20 4L32 24L12 24L20 4Z" fill="#DC2626" opacity="0.9"/>
    <path d="M44 4L52 24L32 24L44 4Z" fill="#B91C1C"/>
    <!-- Outer Ring -->
    <circle cx="32" cy="38" r="21" fill="#CA8A04"/>
    <!-- Main Disc Gradient -->
    <circle cx="32" cy="38" r="19" fill="url(#goldGrad)"/>
    <circle cx="32" cy="38" r="15" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Center Star Symbol -->
    <polygon points="32,27 34.5,33 41,33.5 36,37.5 37.5,44 32,40 26.5,44 28,37.5 23,33.5 29.5,33" fill="#854D0E"/>
    <!-- Inner Rank 1 Text -->
    <text x="32" y="41.5" font-size="14" font-weight="900" text-anchor="middle" fill="#FEF08A">1</text>
    <defs>
      <linearGradient id="goldGrad" x1="16" y1="18" x2="48" y2="58" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FEF08A"/>
        <stop offset="40%" stop-color="#EAB308"/>
        <stop offset="100%" stop-color="#CA8A04"/>
      </linearGradient>
    </defs>
  </symbol>

